name: Paper Daily

on:
  push:
    branches: [main]
  schedule:
    # 每周五 09:00（北京时间）= 周五 01:00 UTC
    - cron: "0 1 * * 5"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "首次初始化要回看最近几天的 arXiv 论文"
        required: false
        default: "7"
      clear_cache:
        description: "是否清空历史缓存后重新生成论文列表"
        required: false
        default: "false"
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    if: github.event_name != 'issues' || github.event.issue.title == 'Research Interests'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore paper data cache
        uses: actions/cache/restore@v4
        with:
          path: .paper-cache
          key: paper-data-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            paper-data-

      - name: Hydrate cached paper data
        env:
          REPO: ${{ github.repository }}
        run: |
          # 上一期的数据可能在三个地方，取"时间戳最新"的那份：
          #   1) Actions 缓存（7 天不用就会被 GitHub 清掉，不可靠）
          #   2) 仓库里提交过的 web/data/*.json（每周都会提交回 main，最可靠）
          #   3) 线上已部署的站点（前两者都缺时的兜底）
          # 「新论文不和之前的重复」完全依赖这里拿到上一期数据，取错一份就会重复推送，
          # 所以不按顺序猜，直接比 generated_at_iso。
          python3 - <<'PY'
          import json, os, shutil, urllib.request
          from pathlib import Path

          cache = Path(".paper-cache")
          data = Path("web/data")
          cache.mkdir(parents=True, exist_ok=True)
          data.mkdir(parents=True, exist_ok=True)
          owner, repo = os.environ["REPO"].split("/")[:2]
          site = f"https://{owner}.github.io/{repo}/data"

          def stamp(path: Path) -> str:
              try:
                  return str(json.loads(path.read_text(encoding="utf-8")).get("generated_at_iso") or "")
              except Exception:
                  return ""

          for name in ("papers.json", "conference_papers.json"):
              options = []
              for path, label in ((cache / name, "actions cache"), (data / name, "repo commit")):
                  if path.exists() and path.stat().st_size > 0 and stamp(path):
                      options.append((stamp(path), path, label))
              live = cache / f"{name}.live"
              try:
                  urllib.request.urlretrieve(f"{site}/{name}", live)
                  if stamp(live):
                      options.append((stamp(live), live, "live site"))
              except Exception as exc:  # noqa: BLE001
                  print(f"live fetch failed for {name}: {exc}")
              if not options:
                  print(f"Warning: no previous {name} anywhere, archive starts empty")
                  continue
              _, best, label = max(options, key=lambda item: item[0])
              shutil.copy(best, data / name)
              shutil.copy(best, cache / name)
              print(f"Hydrate {name}: {label} ({stamp(data / name)})")
          PY

      - name: Collect arXiv papers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIG_ISSUE_TITLE: Research Interests
          PAPER_WINDOW_START: ${{ vars.PAPER_WINDOW_START || '2018-01-01' }}
          WEEKLY_NEW_TOTAL: ${{ vars.WEEKLY_NEW_TOTAL || '10' }}
          RADAR_COLLECTION_COUNT: ${{ vars.RADAR_COLLECTION_COUNT || '2' }}
          WEEKLY_NEW_PAPERS: ${{ vars.WEEKLY_NEW_PAPERS || '' }}
          LOOKBACK_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.lookback_days || vars.LOOKBACK_DAYS || '7' }}
          MAX_PER_TOPIC: ${{ vars.MAX_PER_TOPIC || '25' }}
          MAX_SUMMARIES: ${{ vars.MAX_SUMMARIES || '40' }}
          MAX_NEW_PAPERS: ${{ vars.MAX_NEW_PAPERS || '60' }}
          MAX_STORED_PAPERS: ${{ vars.MAX_STORED_PAPERS || '1200' }}
          MAX_DATA_BYTES: ${{ vars.MAX_DATA_BYTES || '12582912' }}
          RECENT_HISTORY_DAYS: ${{ vars.RECENT_HISTORY_DAYS || '45' }}
          PAPER_SOURCES: ${{ vars.PAPER_SOURCES || 'arxiv' }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL || '' }}
          CROSSREF_EMAIL: ${{ vars.CROSSREF_EMAIL || '' }}
          OPENALEX_EMAIL: ${{ vars.OPENALEX_EMAIL || vars.CONTACT_EMAIL || '' }}
          SOURCE_DELAY_SECONDS: ${{ vars.SOURCE_DELAY_SECONDS || '3' }}
          ARXIV_QUERY_MODE: ${{ vars.ARXIV_QUERY_MODE || 'category' }}
          ARXIV_WINDOW_SEARCH: ${{ vars.ARXIV_WINDOW_SEARCH || 'true' }}
          ARXIV_WINDOW_RESULTS: ${{ vars.ARXIV_WINDOW_RESULTS || '40' }}
          SCREEN_MODE: ${{ vars.SCREEN_MODE || 'llm' }}
          SCREEN_MIN_SCORE: ${{ vars.SCREEN_MIN_SCORE || '45' }}
          SCREEN_BATCH_SIZE: ${{ vars.SCREEN_BATCH_SIZE || '6' }}
          SCREEN_CONCURRENCY: ${{ vars.SCREEN_CONCURRENCY || '3' }}
          SCREEN_MAX_PAPERS: ${{ vars.SCREEN_MAX_PAPERS || '1200' }}
          SCREEN_CACHE_DAYS: ${{ vars.SCREEN_CACHE_DAYS || '60' }}
          SCREEN_TRUNCATE_BY: ${{ vars.SCREEN_TRUNCATE_BY || 'score' }}
          SCREEN_CACHE_PATH: .paper-cache/screen_cache.json
          ARXIV_SORT_BY: ${{ vars.ARXIV_SORT_BY || 'lastUpdatedDate' }}
          ARXIV_EXPAND_CATEGORY_SEARCH: ${{ vars.ARXIV_EXPAND_CATEGORY_SEARCH || 'false' }}
          ARXIV_CATEGORY_MAX_RESULTS: ${{ vars.ARXIV_CATEGORY_MAX_RESULTS || vars.MAX_PER_TOPIC || '10' }}
          ARXIV_IN_TOPIC_DELAY_SECONDS: ${{ vars.ARXIV_IN_TOPIC_DELAY_SECONDS || '3' }}
          MIN_DAILY_PAPERS: ${{ vars.MIN_DAILY_PAPERS || '10' }}
          DAILY_BACKFILL_DAYS: ${{ vars.DAILY_BACKFILL_DAYS || '14' }}
          MIN_PAPER_SCORE: ${{ vars.MIN_PAPER_SCORE || '0.08' }}
          MIN_TITLE_ONLY_SCORE: ${{ vars.MIN_TITLE_ONLY_SCORE || '0.18' }}
          ENABLE_SEMANTIC_SCHOLAR: ${{ vars.ENABLE_SEMANTIC_SCHOLAR || 'false' }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          CUSTOM_FEED_HEADERS: ${{ secrets.CUSTOM_FEED_HEADERS }}
          CUSTOM_FEED_BEARER_TOKEN: ${{ secrets.CUSTOM_FEED_BEARER_TOKEN }}
          CLEAR_PAPER_CACHE: ${{ github.event_name == 'workflow_dispatch' && inputs.clear_cache || vars.CLEAR_PAPER_CACHE || 'false' }}
          INCREMENTAL_SINCE_LAST_RUN: ${{ github.event_name == 'schedule' && 'true' || vars.INCREMENTAL_SINCE_LAST_RUN || 'false' }}
          LLM_CONCURRENCY: ${{ vars.LLM_CONCURRENCY || '2' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL || secrets.LLM_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          # 顶刊数据由下一步的 OpenAlex 脚本负责，这里把会议输出写到缓存目录避免覆盖
          python scripts/collect_papers.py --conference-output .paper-cache/conference_unused.json

      - name: Collect journal papers
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL || '' }}
          OPENALEX_EMAIL: ${{ vars.OPENALEX_EMAIL || vars.CONTACT_EMAIL || '' }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          PAPER_WINDOW_START: ${{ vars.PAPER_WINDOW_START || '2018-01-01' }}
          WEEKLY_NEW_TOTAL: ${{ vars.WEEKLY_NEW_TOTAL || '10' }}
          RADAR_COLLECTION_COUNT: ${{ vars.RADAR_COLLECTION_COUNT || '2' }}
          WEEKLY_NEW_PAPERS: ${{ vars.WEEKLY_NEW_PAPERS || '' }}
          SCREEN_MODE: ${{ vars.SCREEN_MODE || 'llm' }}
          SCREEN_MIN_SCORE: ${{ vars.SCREEN_MIN_SCORE || '45' }}
          SCREEN_BATCH_SIZE: ${{ vars.SCREEN_BATCH_SIZE || '6' }}
          SCREEN_CONCURRENCY: ${{ vars.SCREEN_CONCURRENCY || '3' }}
          SCREEN_MAX_PAPERS: ${{ vars.SCREEN_MAX_PAPERS || '1200' }}
          SCREEN_CACHE_DAYS: ${{ vars.SCREEN_CACHE_DAYS || '60' }}
          SCREEN_TRUNCATE_BY: ${{ vars.SCREEN_TRUNCATE_BY || 'score' }}
          SCREEN_CACHE_PATH: .paper-cache/screen_cache.json
          JOURNAL_PER_VENUE_RESULTS: ${{ vars.JOURNAL_PER_VENUE_RESULTS || '50' }}
          JOURNAL_MAX_PAGES: ${{ vars.JOURNAL_MAX_PAGES || '1' }}
          JOURNAL_VENUE_DELAY_SECONDS: ${{ vars.JOURNAL_VENUE_DELAY_SECONDS || '1' }}
          MAX_NEW_JOURNAL_PAPERS: ${{ vars.MAX_NEW_JOURNAL_PAPERS || '60' }}
          MAX_JOURNAL_SUMMARIES: ${{ vars.MAX_JOURNAL_SUMMARIES || '40' }}
          MAX_STORED_JOURNAL_PAPERS: ${{ vars.MAX_STORED_JOURNAL_PAPERS || '1200' }}
          MAX_JOURNAL_PER_VENUE: ${{ vars.MAX_JOURNAL_PER_VENUE || '3' }}
          MIN_JOURNAL_SCORE: ${{ vars.MIN_JOURNAL_SCORE || '0.18' }}
          MAX_DATA_BYTES: ${{ vars.MAX_DATA_BYTES || '12582912' }}
          CLEAR_PAPER_CACHE: ${{ github.event_name == 'workflow_dispatch' && inputs.clear_cache || vars.CLEAR_PAPER_CACHE || 'false' }}
          LLM_CONCURRENCY: ${{ vars.LLM_CONCURRENCY || '2' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL || secrets.LLM_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/collect_journals.py

      - name: Persist paper data back to the repo
        run: |
          # 把本期数据提交回 main，作用有两个：
          #   1) 上一期数据永久留在 git 里，不依赖 7 天就会过期的 Actions 缓存；
          #   2) 每周都有一次提交，仓库不会因为 60 天无活动而被 GitHub 停用定时任务。
          # 用 GITHUB_TOKEN 发起的 push 不会再次触发工作流，不存在循环触发。
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/papers.json web/data/conference_papers.json
          if git diff --cached --quiet; then
            echo "No paper data change to commit"
            exit 0
          fi
          git commit -m "data: weekly paper update [skip ci]"
          git push origin HEAD:main

      - name: Stage paper data cache
        run: |
          mkdir -p .paper-cache
          cp web/data/papers.json .paper-cache/papers.json
          if [ -f web/data/conference_papers.json ]; then
            cp web/data/conference_papers.json .paper-cache/conference_papers.json
          fi

      - name: Save paper data cache
        uses: actions/cache/save@v4
        with:
          path: .paper-cache
          key: paper-data-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
